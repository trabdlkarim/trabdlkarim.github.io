### Site Settings ###
title               : "TOURE A. KARIM"
description         : >-
                      I’m a web developer fueled by creativity, curiosity, and probably too much coffee. 
                      I love turning ideas into sleek, interactive websites and apps that people actually enjoy using. 
                      Every bit of support helps me build cooler projects, explore new ideas, and keep creating awesome 
                      experiences.
baseurl             : ""            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : trabdlkarim/trabdlkarim.github.io      # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)
remote_theme        : yousinix/portfolYOU
open_new_tab        : true                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:             # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/blog.html  # Remove this line to enable site blog
  - pages/index.md
  - documentation/partials/**  # For Documentation Only


### Author Info ###
author:
  name              : TOURE A. KARIM
  image             : https://trabdlkarim.me/assets/images/profile.jpg
# behance           : your_username
# dribbble          : your_username
  email             : mail@trabdlkarim.me
# facebook          : your_username
  github            : trabdlkarim
# gitlab            : your_username
# instagram         : your_username
# kaggle            : your_username
  linkedin          : trabdlkarim
# medium            : your_username
# soundcloud        : your_username
# spotify           : your_username
# stackoverflow     : your_user_id
# tumblr            : your_username.tumblr.com
# twitch            : your_username
# twitter           : your_username
# vimeo             : your_username
# youtube           : your_channel_name
# keybase           : your_username


### Posts ###
permalink: /blog/:title


### Collections ###
collections:
  projects:
    output: true
    permalink: /projects/:name
  elements:                                             # For Documentation Only
    output: true                                        # For Documentation Only


### Disqus ###
disqus:
  shortname: your-short-name-disqus                     # Your website Shortname on disqus


### Analytics ###
analytics:
  enabled: false                                        # Set true to enable analytics
  google:
    tracking_id: your-google-tracking-id


### Buy me a coffee ###
# See https://www.buymeacoffee.com/
buymeacoffee:
  enabled: true
  username: trabdlkarim
  color: "#007bff"
  message: "Thank you for visiting."                    # Message to be displayed aside from the button for a few seconds.
  description: "Support me on Buy me a coffee!"


### Defaults for collections ###
defaults:
  - scope:
      path: ""
      type: "projects"
    values:
      layout: "page"
  - scope:                                              # For Documentation Only
      path: ""                                          # For Documentation Only
      type: "elements"                                  # For Documentation Only
    values:                                             # For Documentation Only
      layout: "element"                                 # For Documentation Only
  - scope:
      path: ""
      type: "posts"
    values:
      comments: false                                   # Set to true to enable disqus comments


### Exclude from processing ###
exclude:
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.log"
